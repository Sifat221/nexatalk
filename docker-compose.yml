version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexatalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexatalk
      POSTGRES_PASSWORD: nexatalk_secret_password
      POSTGRES_DB: nexatalk_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexatalk -d nexatalk_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexatalk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nexatalk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: nexatalk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nexatalk:nexatalk_secret_password@postgres:5432/nexatalk_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: nexatalk_jwt_access_secret_key_production_2026_super_secure
      JWT_REFRESH_SECRET: nexatalk_jwt_refresh_secret_key_production_2026_super_secure
      CORS_ORIGIN: '*'
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
  minio_data:
