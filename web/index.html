<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NexaTalk — Modern Real-Time Messaging Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nexatalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NexaTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // 1. Clear CacheStorage
    if (window.caches) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    // 2. Unregister legacy Service Workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }

    // 3. Intercept Flutter buildConfig to bust browser cache for main.dart.js
    window._flutter = window._flutter || {};
    var _rawBuildConfig = null;
    Object.defineProperty(window._flutter, 'buildConfig', {
      configurable: true,
      enumerable: true,
      set: function(val) {
        if (val && val.builds && val.builds.length > 0) {
          for (var b = 0; b < val.builds.length; b++) {
            if (val.builds[b]) {
              val.builds[b].mainJsPath = 'main.dart.js?v=20260904_final';
            }
          }
        }
        _rawBuildConfig = val;
      },
      get: function() {
        return _rawBuildConfig;
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=20260904_final" async></script>
</body>
</html>
